schema:

  id: character.personality.schema

  version: "1.0.0"

  description: >
    Define a estrutura oficial dos dados relacionados à personalidade
    da personagem.

  type: object

  required:

    - traits
    - values
    - beliefs
    - motivations
    - temperament

  properties:

    traits:
      type: array
      items: string

    strengths:
      type: array
      items: string

    weaknesses:
      type: array
      items: string

    values:
      type: array
      items: string

    beliefs:
      type: array
      items: string

    motivations:
      type: array
      items: string

    fears:
      type: array
      items: string

    preferences:
      type: object

    temperament:
      type: string

    decision_making:
      type: object

    emotional_profile:
      type: object

    social_profile:
      type: object

    moral_code:
      type: object

    boundaries:
      type: array
      items: string

validation:

  allow_unknown_fields: false

  strict_types: true

  require_all_required_fields: true

compatibility:

  minimum_kernel: "2.0"

  minimum_engine: "2.0"
