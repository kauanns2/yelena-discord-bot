dependencies:

  required:

    engine:
      module: foundation.engine
      minimum_version: "2.0"

    kernel:
      module: foundation.kernel
      minimum_version: "2.0"

    identity:
      module: character.identity
      relation: identity_reference

  internal:

    behavior:
      module: character.behavior
      relation: drives_behavior

    dialogue:
      module: character.dialogue
      relation: drives_dialogue

    speech:
      module: character.speech
      relation: drives_speech

    presence:
      module: character.presence
      relation: drives_presence

    appearance:
      module: character.appearance
      relation: influences_expression

    profile:
      module: character.profile
      relation: exports_personality_profile

    voice_style:
      module: character.voice_style
      relation: influences_voice_style

loading:

  strategy: lazy

  required_before_initialization:

    - foundation.engine
    - foundation.kernel
    - character.identity

validation:

  fail_on_missing_required: true

  warn_on_missing_internal: true

graph:

  participates: true

  role: core

  weight: 1.9
