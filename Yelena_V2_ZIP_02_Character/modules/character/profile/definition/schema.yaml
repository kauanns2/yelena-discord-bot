schema:

  id: character.profile.schema

  version: "1.0.0"

  description: >
    Define a estrutura oficial do perfil consolidado da personagem,
    reunindo informações públicas e persistentes provenientes dos
    demais subsistemas do módulo Character.

  type: object

  required:

    - basic_information
    - appearance_summary
    - personality_summary
    - current_status

  properties:

    basic_information:
      type: object

    biography_summary:
      type: string

    appearance_summary:
      type: string

    personality_summary:
      type: string

    behavior_summary:
      type: string

    presence_summary:
      type: string

    speech_summary:
      type: string

    voice_style_summary:
      type: string

    preferences_summary:
      type: object

    current_status:
      type: object

    public_information:
      type: object

    languages:
      type: array
      items: string

    occupation:
      type: string

    aliases:
      type: array
      items: string

validation:

  allow_unknown_fields: false

  strict_types: true

  require_all_required_fields: true

compatibility:

  minimum_kernel: "2.0"

  minimum_engine: "2.0"
