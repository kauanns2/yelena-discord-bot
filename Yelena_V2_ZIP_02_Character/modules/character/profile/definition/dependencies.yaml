dependencies:

  required:

    engine:
      module: foundation.engine
      minimum_version: "2.0"

    kernel:
      module: foundation.kernel
      minimum_version: "2.0"

    identity:
      module: character.identity
      relation: provides_identity_data

  internal:

    appearance:
      module: character.appearance
      relation: provides_appearance_summary

    personality:
      module: character.personality
      relation: provides_personality_summary

    behavior:
      module: character.behavior
      relation: provides_behavior_summary

    presence:
      module: character.presence
      relation: provides_presence_summary

    dialogue:
      module: character.dialogue
      relation: provides_dialogue_summary

    speech:
      module: character.speech
      relation: provides_speech_summary

    voice_style:
      module: character.voice_style
      relation: provides_voice_style_summary

loading:

  strategy: lazy

  required_before_initialization:

    - foundation.engine
    - foundation.kernel
    - character.identity

validation:

  fail_on_missing_required: true

  warn_on_missing_internal: true

graph:

  participates: true

  role: aggregator

  weight: 1.7
