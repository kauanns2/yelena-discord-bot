id: character.profile

name: Profile

module: character

version: "1.0.0"

status: stable

priority: 1.7

description: >
  Subsistema responsável por consolidar informações públicas e
  persistentes da personagem em um perfil unificado. Atua como
  ponto central de consulta para outros módulos, reduzindo a
  duplicação de dados e facilitando o acesso às informações
  essenciais da personagem.

exports:

  - profile
  - public_information
  - character_summary
  - biography_summary
  - personality_summary
  - appearance_summary
  - preferences_summary
  - current_status

imports:

  - character.identity
  - character.appearance
  - character.personality
  - character.behavior
  - character.presence
  - character.dialogue
  - character.speech
  - character.voice_style

used_by:

  - foundation.engine
  - foundation.kernel
  - memory
  - context
  - reasoning

web_brain:

  node: true

  activation_weight: 1.7

  participates_in_context: true

persistent: true

load: automatic
