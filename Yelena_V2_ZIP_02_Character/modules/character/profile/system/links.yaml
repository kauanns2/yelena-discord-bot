links:

  parent:

    - character

  children: []

  depends_on:

    - character.identity
    - character.appearance
    - character.personality
    - character.behavior
    - character.presence
    - character.dialogue
    - character.speech
    - character.voice_style

  influences:

    - foundation.engine
    - foundation.kernel
    - memory
    - context
    - reasoning

  web_brain:

    incoming:

      - character.identity
      - character.appearance
      - character.personality
      - character.behavior
      - character.presence
      - character.dialogue
      - character.speech
      - character.voice_style

    outgoing:

      - foundation.engine
      - foundation.kernel
      - memory
      - context
      - reasoning

    activation_weight: 1.7

    propagation: contextual

    bidirectional: false

metadata:

  description: >
    Define as conexões do subsistema Profile com os demais módulos da
    arquitetura Web Brain. O Profile consolida informações públicas da
    personagem e as disponibiliza como referência para consultas rápidas
    durante o processamento de contexto.

  version: "1.0.0"
