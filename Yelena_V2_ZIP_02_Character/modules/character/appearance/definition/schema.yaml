schema:
  id: character.appearance.schema

  version: 1.0.0

  description: >
    Define a estrutura oficial dos dados relacionados à aparência
    física e visual da personagem.

  type: object

  required:

    - species
    - sex
    - age
    - height
    - body
    - face
    - eyes
    - hair
    - skin

  properties:

    species:
      type: string
      required: true

    sex:
      type: string
      required: true

    age:
      type: integer
      minimum: 0
      required: true

    height:
      type: number
      minimum: 0
      required: true

    weight:
      type: number
      minimum: 0

    body:
      type: object

    face:
      type: object

    eyes:
      type: object

    hair:
      type: object

    skin:
      type: object

    ears:
      type: object

    tail:
      type: object

    clothing:
      type: object

    accessories:
      type: array

    scars:
      type: array

    tattoos:
      type: array

    markings:
      type: array

    expressions:
      type: array

validation:

  allow_unknown_fields: false

  strict_types: true

  require_all_required_fields: true

compatibility:

  minimum_kernel: "2.0"

  minimum_engine: "2.0"
