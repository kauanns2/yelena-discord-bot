links:

  parent:

    - character

  children: []

  depends_on:

    - character.identity
    - character.personality
    - character.behavior
    - character.dialogue
    - character.presence
    - character.speech

  influences:

    - character.profile
    - foundation.engine
    - foundation.kernel

  web_brain:

    incoming:

      - character.identity
      - character.personality
      - character.behavior
      - character.dialogue
      - character.presence
      - character.speech

    outgoing:

      - character.profile
      - foundation.engine
      - foundation.kernel

    activation_weight: 1.9

    propagation: contextual

    bidirectional: false

metadata:

  description: >
    Define os relacionamentos do subsistema Voice Style dentro
    da arquitetura Web Brain. Especifica como a identidade
    comunicativa da personagem recebe informações dos demais
    módulos e como influencia a geração final das mensagens.

  version: "1.0.0"
