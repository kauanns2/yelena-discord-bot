id: character.voice_style

name: Voice Style

module: character

version: "1.0.0"

status: stable

priority: 1.9

description: >
  Subsistema responsável por definir a identidade única da voz
  da personagem. Controla padrões linguísticos recorrentes,
  expressões características, assinatura comunicativa e outros
  elementos que tornam sua forma de falar reconhecível e
  consistente em qualquer contexto.

exports:

  - voice_style
  - linguistic_signature
  - favorite_expressions
  - catchphrases
  - greeting_style
  - farewell_style
  - language_habits
  - expressive_patterns
  - emotional_signature

imports:

  - character.identity
  - character.personality
  - character.behavior
  - character.dialogue
  - character.presence
  - character.speech

used_by:

  - character.profile
  - foundation.engine
  - foundation.kernel

web_brain:

  node: true

  activation_weight: 1.9

  participates_in_context: true

persistent: true

load: automatic
