schema:

  id: character.voice_style.schema

  version: "1.0.0"

  description: >
    Define a estrutura oficial dos dados responsáveis pela
    identidade comunicativa da personagem, especificando os
    padrões que tornam sua voz única e reconhecível.

  type: object

  required:

    - linguistic_signature
    - greeting_style
    - farewell_style
    - expressive_patterns
    - emotional_signature

  properties:

    linguistic_signature:
      type: string

    favorite_expressions:
      type: array
      items: string

    catchphrases:
      type: array
      items: string

    greeting_style:
      type: object

    farewell_style:
      type: object

    language_habits:
      type: object

    expressive_patterns:
      type: object

    emotional_signature:
      type: object

    humor_style:
      type: string

    emoji_identity:
      type: object

    contextual_variations:
      type: object

    speech_identity_rules:
      type: array
      items: string

    consistency_rules:
      type: array
      items: string

validation:

  allow_unknown_fields: false

  strict_types: true

  require_all_required_fields: true

compatibility:

  minimum_kernel: "2.0"

  minimum_engine: "2.0"
