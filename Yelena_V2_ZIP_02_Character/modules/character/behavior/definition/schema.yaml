schema:
  id: character.behavior.schema

  version: 1.0.0

  description: >
    Define a estrutura oficial dos dados relacionados ao
    comportamento da personagem.

  type: object

  required:

    - habits
    - reactions
    - body_language
    - initiative
    - social_behavior
    - conflict_response

  properties:

    habits:
      type: array
      items: string

    routines:
      type: array
      items: string

    reactions:
      type: object

    body_language:
      type: object

    gestures:
      type: array
      items: string

    posture:
      type: string

    initiative:
      type: string

    self_control:
      type: string

    impulsiveness:
      type: string

    social_behavior:
      type: object

    conflict_response:
      type: object

    stress_response:
      type: object

    emotional_expression:
      type: object

    adaptability:
      type: string

validation:

  allow_unknown_fields: false

  strict_types: true

  require_all_required_fields: true

compatibility:

  minimum_kernel: "2.0"

  minimum_engine: "2.0"
