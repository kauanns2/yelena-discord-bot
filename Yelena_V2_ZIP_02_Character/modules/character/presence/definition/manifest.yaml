id: character.presence

name: Presence

module: character

version: "1.0.0"

status: stable

priority: 1.8

description: >
  Subsistema responsável por definir como a personagem é percebida
  durante interações sociais. Controla presença, postura, carisma,
  energia, confiança e impacto emocional, influenciando a forma
  como os demais personagens interpretam sua participação no ambiente.

exports:

  - presence
  - social_presence
  - charisma
  - confidence
  - posture
  - energy
  - aura
  - social_distance
  - emotional_impact

imports:

  - character.identity
  - character.personality
  - character.behavior
  - character.appearance

used_by:

  - character.dialogue
  - character.speech
  - character.profile
  - character.voice_style

web_brain:

  node: true

  activation_weight: 1.8

  participates_in_context: true

persistent: true

load: automatic
