dependencies:

  required:

    engine:
      module: foundation.engine
      minimum_version: "2.0"

    kernel:
      module: foundation.kernel
      minimum_version: "2.0"

    identity:
      module: character.identity
      relation: identity_reference

  internal:

    personality:
      module: character.personality
      relation: defines_social_expression

    behavior:
      module: character.behavior
      relation: influences_presence

    appearance:
      module: character.appearance
      relation: supports_visual_presence

    dialogue:
      module: character.dialogue
      relation: expresses_presence

    speech:
      module: character.speech
      relation: expresses_tone

    profile:
      module: character.profile
      relation: exports_presence_profile

    voice_style:
      module: character.voice_style
      relation: reinforces_presence

loading:

  strategy: lazy

  required_before_initialization:

    - foundation.engine
    - foundation.kernel
    - character.identity

validation:

  fail_on_missing_required: true

  warn_on_missing_internal: true

graph:

  participates: true

  role: core

  weight: 1.8
