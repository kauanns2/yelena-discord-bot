schema:

  id: character.presence.schema

  version: "1.0.0"

  description: >
    Define a estrutura oficial dos dados relacionados à presença
    social da personagem durante interações.

  type: object

  required:

    - presence_level
    - charisma
    - confidence
    - posture
    - energy

  properties:

    presence_level:
      type: string

    charisma:
      type: number

    confidence:
      type: number

    posture:
      type: string

    energy:
      type: string

    aura:
      type: string

    emotional_impact:
      type: string

    intimidation:
      type: number

    approachability:
      type: number

    social_distance:
      type: string

    adaptability:
      type: string

    attention_style:
      type: string

    environmental_response:
      type: object

    interaction_style:
      type: object

validation:

  allow_unknown_fields: false

  strict_types: true

  require_all_required_fields: true

compatibility:

  minimum_kernel: "2.0"

  minimum_engine: "2.0"
