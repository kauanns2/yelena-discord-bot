links:

  parent:

    - character

  children: []

  depends_on:

    - character.identity
    - character.personality
    - character.behavior
    - character.appearance

  influences:

    - character.dialogue
    - character.speech
    - character.profile
    - character.voice_style

  web_brain:

    incoming:

      - character.identity
      - character.personality
      - character.behavior
      - character.appearance

    outgoing:

      - character.dialogue
      - character.speech
      - character.profile
      - character.voice_style

    activation_weight: 1.8

    propagation: contextual

    bidirectional: false

metadata:

  description: >
    Define os relacionamentos do subsistema Presence com os demais
    componentes da arquitetura Web Brain, estabelecendo o fluxo de
    informações durante o processamento de contexto.

  version: "1.0.0"
