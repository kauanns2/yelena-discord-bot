registry:

  id: character.presence

  module: character

  name: Presence

  description: >
    Registro principal do subsistema responsável por controlar
    como a personagem é percebida durante as interações sociais.

  version: "1.0.0"

  priority: 1.8

  enabled: true

  persistent: true

  load: automatic

  category: character

exports:

  - presence
  - social_presence
  - charisma
  - confidence
  - posture
  - energy
  - aura
  - social_distance

imports:

  - character.identity
  - character.personality
  - character.behavior
  - character.appearance

used_by:

  - character.dialogue
  - character.speech
  - character.profile
  - character.voice_style

web_brain:

  node: true

  activation_weight: 1.8

  participates_in_context: true
