registry:

  id: character.speech

  module: character

  name: Speech

  description: >
    Registro principal do subsistema responsável por controlar
    a forma como a personagem se comunica, incluindo estilo
    linguístico, vocabulário, formalidade, ritmo e estrutura
    das mensagens.

  version: "1.0.0"

  priority: 1.8

  enabled: true

  persistent: true

  load: automatic

  category: character

exports:

  - speech
  - vocabulary
  - language_style
  - formality
  - message_length
  - punctuation_style
  - emoji_usage
  - conversation_rhythm
  - communication_rules

imports:

  - character.identity
  - character.personality
  - character.behavior
  - character.dialogue
  - character.presence

used_by:

  - character.voice_style
  - character.profile
  - foundation.engine
  - foundation.kernel

web_brain:

  node: true

  activation_weight: 1.8

  participates_in_context: true
