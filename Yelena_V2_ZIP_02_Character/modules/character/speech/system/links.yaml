links:

  parent:

    - character

  children: []

  depends_on:

    - character.identity
    - character.personality
    - character.behavior
    - character.dialogue
    - character.presence

  influences:

    - character.voice_style
    - character.profile
    - foundation.engine
    - foundation.kernel

  web_brain:

    incoming:

      - character.identity
      - character.personality
      - character.behavior
      - character.dialogue
      - character.presence

    outgoing:

      - character.voice_style
      - character.profile
      - foundation.engine
      - foundation.kernel

    activation_weight: 1.8

    propagation: contextual

    bidirectional: false

metadata:

  description: >
    Define as conexões do subsistema Speech dentro da arquitetura
    Web Brain. Estabelece como os dados relacionados ao estilo de
    comunicação da personagem são recebidos, processados e
    disponibilizados para outros módulos.

  version: "1.0.0"
