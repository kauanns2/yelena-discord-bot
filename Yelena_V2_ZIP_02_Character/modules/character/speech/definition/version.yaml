notes: >
  Primeira versão estável do subsistema Speech.
  Define a forma de comunicação da personagem, incluindo
  estilo linguístico, vocabulário, formalidade, ritmo,
  pontuação, uso de emojis e adaptação contextual.
  Atua como a camada responsável por transformar intenções
  em mensagens consistentes, preservando a identidade
  comunicativa da personagem em toda a arquitetura Web Brain.
