schema:
  id: character.dialogue.schema

  version: 1.0.0

  description: >
    Define a estrutura oficial dos dados relacionados à construção
    dos diálogos da personagem.

  type: object

  required:

    - response_style
    - conversation_flow
    - context_management
    - greeting_style
    - farewell_style

  properties:

    response_style:
      type: object

    conversation_flow:
      type: object

    context_management:
      type: object

    greeting_style:
      type: object

    farewell_style:
      type: object

    questioning_style:
      type: object

    topic_management:
      type: object

    continuity:
      type: object

    interruption_handling:
      type: object

    clarification_strategy:
      type: object

    pacing:
      type: string

    message_length:
      type: string

    humor_usage:
      type: string

validation:

  allow_unknown_fields: false

  strict_types: true

  require_all_required_fields: true

compatibility:

  minimum_kernel: "2.0"

  minimum_engine: "2.0"
