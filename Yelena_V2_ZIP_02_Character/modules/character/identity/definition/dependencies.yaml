dependencies:

  required:

    engine:
      module: foundation.engine
      minimum_version: "2.0"

    kernel:
      module: foundation.kernel
      minimum_version: "2.0"

  internal:

    profile:
      module: character.profile
      relation: shared_identity

    personality:
      module: character.personality
      relation: personality_reference

    appearance:
      module: character.appearance
      relation: appearance_reference

    speech:
      module: character.speech
      relation: language_reference

    dialogue:
      module: character.dialogue
      relation: conversation_reference

    behavior:
      module: character.behavior
      relation: behavior_reference

    presence:
      module: character.presence
      relation: presence_reference

loading:

  strategy: lazy

  required_before_initialization:

    - foundation.engine
    - foundation.kernel

validation:

  fail_on_missing_required: true

  warn_on_missing_internal: true

graph:

  participates: true

  weight: 2.0
