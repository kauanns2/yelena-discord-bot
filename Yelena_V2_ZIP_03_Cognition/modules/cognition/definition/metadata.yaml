  - reasoning
  - thinking
  - decision
  - planning
  - attention
  - perception
  - memory
  - knowledge_retrieval
  - learning
  - beliefs
  - opinions
  - psychology
  - imagination
  - executive

imports:

  - character.identity
  - character.personality
  - character.behavior
  - character.profile

used_by:

  - foundation.engine
  - foundation.kernel
  - memory
  - context
  - world
  - relationship

web_brain:

  node: true

  activation_weight: 2.0

  participates_in_context: true

persistent: true

load: automatic
