id: cognition

name: Cognition

module: cognition

version: "1.0.0"

status: stable

priority: 2.0

description: >
  Módulo central responsável pelo processamento cognitivo da Yelena.
  Coordena percepção, atenção, memória, raciocínio, planejamento,
  tomada de decisões e demais processos mentais, funcionando como o
  núcleo de pensamento da arquitetura Web Brain.

exports:

